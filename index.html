<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#07060a" />
    <title>FORGE THE NIGHT</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="FORGE" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; height: 100dvh; background: #07060a; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #8a7a5c; font: 600 14px "Noto Sans KR", sans-serif; letter-spacing: .2em; }
      /* Phones held upright: ask to turn sideways (the game is landscape only). */
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #07060a; color: #e9d9b5; font: 700 18px "Noto Sans KR", sans-serif; text-align: center; place-items: center; }
      #rotate span { display: block; font-size: 56px; margin-bottom: 12px; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: grid; } }
      body.portrait-mode #rotate { display: none !important; }
    </style>
  </head>
  <body>
    <div id="boot">LOADING</div>
    <div id="game"></div>
    <div id="rotate"><div><span>⟳</span>휴대폰을 가로로 돌려 주세요</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
